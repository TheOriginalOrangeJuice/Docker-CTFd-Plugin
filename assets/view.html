{% extends "challenge.html" %}
{% block description %}
{{ challenge.html }}
<div class='mb-3 text-center' id='docker_container'
     name='{{ challenge.docker_image | safe }}'
     data-challenge-id='{{ challenge.id }}'
     data-compose='{{ "true" if challenge.compose_content else "false" }}'>
    <span>
        <a onclick="start_container('{{ challenge.docker_image | safe }}');" class='btn btn-dark'>
            <small style='color:white;'><i class="fas fa-play"></i>  Start Docker Instance for challenge</small>
        </a>
    </span>
</div>
{% endblock %}
